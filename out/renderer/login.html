<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecciTek - Giriş Yap</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      -webkit-app-region: drag;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 100;
    }

    .main-content {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: calc(100vh - 36px);
      margin-top: 36px;
      box-sizing: border-box;
    }

    .login-container {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      padding: 24px 28px 28px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 380px;
      max-width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      margin: auto;
    }

    h2 {
      margin: 0 0 24px;
      font-size: 1.5rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    .check-group {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      text-align: left;
    }

    .check-group:last-of-type {
      margin-bottom: 20px;
    }

    .check-group input {
      margin-right: 8px;
      cursor: pointer;
    }

    .check-group label {
      font-size: 0.85rem;
      color: #94a3b8;
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login:hover {
      background: #0ea5e9;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
    }

    header {
      flex: 0 0 30px;
      width: 100%;
      -webkit-app-region: drag;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    .window-controls {
      -webkit-app-region: no-drag;
      display: flex;
    }

    .ctrl-btn {
      width: 40px;
      height: 30px;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .ctrl-btn.close:hover {
      background: #ef4444;
    }
  </style>
  <script type="module" crossorigin src="./assets/login-DSjHCmqk.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/input-BFAFI04Z.css">
  <link rel="stylesheet" crossorigin href="./assets/theme-CtkZ5-BB.css">
</head>

<body>
  <header>
    <div class="window-controls">
      <button class="ctrl-btn" id="btn-min">—</button>
      <button class="ctrl-btn close" id="btn-close">✕</button>
    </div>
  </header>

  <div class="main-content">
    <div class="login-container">
      <h2>RecciTek WCheck</h2>

      <div class="input-group">
        <label>Kullanıcı Adı</label>
        <input type="text" id="username" placeholder="Kullanıcı adınızı girin">
      </div>

      <div class="input-group">
        <label>Şifre</label>
        <input type="password" id="password" placeholder="Şifrenizi girin">
      </div>

      <div class="check-group">
        <input type="checkbox" id="remember-me">
        <label for="remember-me">Beni Hatırla</label>
      </div>

      <div class="check-group">
        <input type="checkbox" id="auto-login">
        <label for="auto-login">Otomatik Giriş Yap</label>
      </div>

      <button class="btn-login" id="login-btn">Giriş Yap</button>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

</body>
</html>
