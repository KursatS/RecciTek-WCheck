<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öncelikli Cihazlar</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: auto;
            min-height: 100vh;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 12px;
        }

        .header-bar h2 {
            margin: 0;
            font-size: 1.3rem;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-bar {
            position: relative;
            margin-bottom: 16px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            pointer-events: all;
            -webkit-user-select: text;
               -moz-user-select: text;
                    user-select: text;
        }

        .search-bar input:focus {
            border-color: #ef4444;
        }

        .search-bar .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        /* ── Priority Panel ── */
        .priority-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
            background: rgba(239, 68, 68, 0.04);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 20px;
            padding: 20px 24px;
        }

        .priority-form .full-width {
            grid-column: 1 / -1;
        }

        .priority-input {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            pointer-events: all;
            -webkit-user-select: text;
               -moz-user-select: text;
                    user-select: text;
            transition: border-color 0.2s;
        }

        .priority-input:focus {
            border-color: rgba(239, 68, 68, 0.5);
        }

        .btn-add-priority {
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add-priority:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .priority-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .priority-item {
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid rgba(239, 68, 68, 0.15);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .priority-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1);
        }

        .priority-item-body {
            flex: 1;
            font-size: 0.95rem;
        }

        .priority-item-name {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .priority-item-serial {
            font-size: 0.85rem;
            color: #f59e0b;
            font-weight: 600;
            background: rgba(245, 158, 11, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .priority-item-desc {
            margin-top: 8px;
            color: var(--text-muted);
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }

        .priority-item-meta {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #64748b;
            text-align: right;
        }

        .btn-del-priority {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 6px 10px;
            border-radius: 8px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .btn-del-priority:hover {
            background: #ef4444;
            color: white;
        }

        .priority-empty {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border: 1px dashed var(--glass-border);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .priority-empty-icon {
            font-size: 2rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .light .search-bar input {
            background: white;
            color: #1e293b;
        }

        .light .priority-item {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .light .priority-item-desc {
            background: #f8fafc;
        }
    </style>
  <script type="module" crossorigin src="./assets/priority-CLgYbNb4.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/svgUtils-BxY6k_uX.js">
  <link rel="stylesheet" crossorigin href="./assets/input-BgXuQ7kZ.css">
  <link rel="stylesheet" crossorigin href="./assets/theme-CtxYo9VL.css">
</head>

<body class="dark">
    <div class="header-bar">
        <h2>⚠️ Öncelikli Cihazlar Müşteri İstekleri</h2>
    </div>

    <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="priority-search" placeholder="Seri No veya Müşteri İsmi ile kayıtları filtreleyin...">
    </div>

    <!-- Ekleme Formu: Sadece MH -->
    <div id="priority-form-section" style="display: none;">
        <div class="priority-form">
            <input class="priority-input" type="text" id="pd-customer" placeholder="Müşteri İsmi *">
            <input class="priority-input" type="text" id="pd-serial" placeholder="Seri No (opsiyonel)">
            <textarea class="priority-input full-width" id="pd-desc" placeholder="Açıklama veya ek bilgi *" rows="3"
                style="resize:vertical;"></textarea>
            <div class="full-width" style="display: flex; justify-content: flex-end;">
                <button class="btn-add-priority" id="btn-add-priority">➕ Kayıt Ekle</button>
            </div>
        </div>
    </div>

    <!-- Cihaz Listesi -->
    <div class="priority-list" id="priority-list">
        <!-- JS Tarafından doldurulacak -->
    </div>

</body>

</html>
