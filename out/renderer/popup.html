<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <title>RecciTek Popup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --width: 470px;
      --height: 330px;
      --radius: 24px;
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-main: #fff;
      --popup-text-muted: rgba(255, 255, 255, 0.9);
      --grad-recci: linear-gradient(135deg, #059669 0%, #10b981 100%);
      --grad-kvk: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      --grad-none: linear-gradient(135deg, #4b5563 0%, #6b7280 100%);
      --grad-error: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
      --grad-priority: linear-gradient(135deg, #991b1b 0%, #dc2626 55%, #f97316 100%);
      --fs-status: 20px;
      --fs-serial: 32px;
      --fs-model: 22px;
    }

    .size-1 { --width: 400px; --height: 300px; --radius: 20px; --fs-status: 18px; --fs-serial: 26px; --fs-model: 18px; }
    .size-2 { --width: 460px; --height: 330px; --radius: 24px; --fs-status: 20px; --fs-serial: 30px; --fs-model: 21px; }
    .size-3 { --width: 500px; --height: 350px; --radius: 28px; --fs-status: 22px; --fs-serial: 34px; --fs-model: 24px; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
           user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
    }

    .popup-container {
      width: var(--width);
      height: var(--height);
      background: var(--grad-none);
      border-radius: var(--radius);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 26px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      animation: zoomIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    @keyframes zoomIn {
      from { transform: scale(0.82); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .theme-recci { background: var(--grad-recci); }
    .theme-kvk { background: var(--grad-kvk); }
    .theme-none { background: var(--grad-none); }
    .theme-error { background: var(--grad-error); }
    .theme-priority { background: var(--grad-priority); }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.12);
      border: none;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      transform: rotate(90deg);
    }

    .status-badge {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 22px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .check-icon {
      width: 20px;
      height: 20px;
      fill: var(--text-main);
      stroke: var(--text-main);
    }

    .status-text {
      color: var(--text-main);
      font-size: var(--fs-status);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .serial-number {
      font-size: var(--fs-serial);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.05;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    .model-info {
      font-size: var(--fs-model);
      font-weight: 500;
      color: var(--popup-text-muted);
      margin-bottom: 24px;
      line-height: 1.2;
    }

    .priority-meta {
      display: none;
      width: 100%;
      max-width: 360px;
      min-height: 58px;
      max-height: 58px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.84);
      line-height: 1.4;
      margin: -8px 0 24px;
      padding: 0 8px;
      overflow-y: auto;
    }

    .copy-button,
    .action-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 28px;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      backdrop-filter: blur(5px);
    }

    .copy-button:hover,
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .copy-button:active,
    .action-btn:active {
      transform: scale(0.97);
    }

    .action-row {
      display: none;
      justify-content: center;
      width: 100%;
    }

    .action-btn {
      min-width: 0;
      width: auto;
    }

    .progress-wrapper {
      position: absolute;
      bottom: 8px;
      left: 20px;
      right: 20px;
      height: 4px;
      background: rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border-radius: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      transform-origin: left;
      will-change: transform;
    }
  </style>
  <link rel="stylesheet" crossorigin href="./assets/input-D3DAzxkw.css">
  <link rel="stylesheet" crossorigin href="./assets/theme-CtkZ5-BB.css">
</head>

<body>
  <div id="popup" class="popup-container">
    <button id="close-btn" class="close-btn" aria-label="Kapat">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
      </svg>
    </button>

    <div class="status-badge">
      <div id="status-icon-container">
        <svg class="check-icon" viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
        </svg>
      </div>
      <span id="status-text" class="status-text">Yükleniyor...</span>
    </div>

    <div id="serial" class="serial-number">...</div>
    <div id="model" class="model-info">...</div>
    <div id="priority-meta" class="priority-meta"></div>

    <button id="copy-btn" class="copy-button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </svg>
      <span id="copy-btn-text">Kopyala</span>
    </button>

    <div id="action-row" class="action-row">
      <button id="open-priority-btn" class="action-btn">Cihaz'a Git</button>
    </div>

    <div id="progress-wrapper" class="progress-wrapper">
      <div id="progress" class="progress-bar"></div>
    </div>
  </div>

  <script>
    const icons = {
      check: '<svg class="check-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" /></svg>',
      info: '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>',
      error: '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'
    };

    const popup = document.getElementById('popup');
    const statusText = document.getElementById('status-text');
    const statusIconContainer = document.getElementById('status-icon-container');
    const serialDisplay = document.getElementById('serial');
    const modelDisplay = document.getElementById('model');
    const priorityMeta = document.getElementById('priority-meta');
    const copyBtn = document.getElementById('copy-btn');
    const copyBtnText = document.getElementById('copy-btn-text');
    const actionRow = document.getElementById('action-row');
    const openPriorityBtn = document.getElementById('open-priority-btn');
    const progressWrapper = document.getElementById('progress-wrapper');
    const progress = document.getElementById('progress');
    const closeBtn = document.getElementById('close-btn');

    closeBtn.addEventListener('click', () => window.electronAPI.closeWindow());

    window.electronAPI.onPopupData((info, duration) => {
      const isPriority = info.variant === 'priority';
      const status = (info.warranty_status || '').toUpperCase();

      popup.className = 'popup-container size-' + (info.sizeLevel || 3);
      popup.classList.remove('theme-recci', 'theme-kvk', 'theme-none', 'theme-error', 'theme-priority');

      serialDisplay.textContent = info.serial || 'Unknown Serial';
      priorityMeta.style.display = 'none';
      actionRow.style.display = 'none';
      copyBtn.style.display = 'none';
      progressWrapper.style.display = 'block';

      if (isPriority) {
        popup.classList.add('theme-priority');
        statusText.textContent = 'ÖNCELİKLİ CİHAZ';
        statusIconContainer.innerHTML = icons.error;
        modelDisplay.textContent = info.customer_name || 'Belirtilmedi';
        priorityMeta.textContent = info.description || 'Bu cihaz öncelikli cihaz listesinde bulunuyor.';
        priorityMeta.style.display = 'block';
        actionRow.style.display = 'flex';
        progressWrapper.style.display = 'none';
      } else if (info.is_error) {
        popup.classList.add('theme-error');
        statusText.textContent = status || 'HATA';
        statusIconContainer.innerHTML = icons.error;
        modelDisplay.textContent = 'Bağlantı kesildi';
      } else if (status.includes('RECCI')) {
        popup.classList.add('theme-recci');
        statusText.textContent = status;
        statusIconContainer.innerHTML = icons.check;
        modelDisplay.textContent = `${info.model_name || ''} - ${info.model_color || ''}`;
        copyBtn.style.display = 'inline-flex';
      } else if (status.includes('KVK')) {
        popup.classList.add('theme-kvk');
        statusText.textContent = status;
        statusIconContainer.innerHTML = icons.check;
        modelDisplay.textContent = `${info.model_name || ''} - ${info.model_color || ''}`;
        copyBtn.style.display = 'inline-flex';
      } else {
        popup.classList.add('theme-none');
        statusText.textContent = status || 'BİLGİ';
        statusIconContainer.innerHTML = icons.info;
        modelDisplay.textContent = 'Garanti kapsamı dışında';
      }

      copyBtn.onclick = () => {
        const textToCopy = `${info.serial}\n${info.model_name || ''} ${info.model_color || ''}\n${info.warranty_status || ''}`;
        navigator.clipboard.writeText(textToCopy);
        const originalText = copyBtnText.textContent;
        copyBtnText.textContent = 'Kopyalandı!';
        copyBtn.style.background = 'rgba(255, 255, 255, 0.4)';
        setTimeout(() => {
          copyBtnText.textContent = originalText;
          copyBtn.style.background = '';
        }, 1500);
      };

      openPriorityBtn.onclick = () => {
        window.electronAPI.openPriorityDevice({
          id: info.id,
          serial: info.serial
        });
        window.electronAPI.closeWindow();
      };

      let startTime = Date.now();
      let progressInterval = null;

      function updateProgress() {
        if (isPriority) return;
        const elapsed = Date.now() - startTime;
        const currentProgress = Math.max(0, 100 - (elapsed / duration * 100));
        progress.style.transform = `scaleX(${currentProgress / 100})`;
        if (currentProgress <= 0 && progressInterval) {
          clearInterval(progressInterval);
        }
      }

      if (!isPriority) {
        progress.style.transform = 'scaleX(1)';
        progressInterval = setInterval(updateProgress, 50);
      }

      popup.onmouseenter = () => {
        if (isPriority) return;
        if (progressInterval) clearInterval(progressInterval);
        window.electronAPI.popupHoverEnter();
      };

      popup.onmouseleave = () => {
        if (isPriority) return;
        const currentTransform = progress.style.transform || 'scaleX(1)';
        const currentWidth = parseFloat(currentTransform.replace('scaleX(', '').replace(')', '')) * 100;
        startTime = Date.now() - ((100 - currentWidth) / 100 * duration);
        progressInterval = setInterval(updateProgress, 50);
        window.electronAPI.popupHoverLeave();
      };
    });
  </script>
</body>

</html>
