<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Cihaz Çağrısı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; user-select:none; -webkit-user-select:none; }

    html, body {
      width: 440px;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .card {
      width: 440px;
      min-height: 100px;
      background: linear-gradient(135deg, #1a2540 0%, #0d1420 100%);
      border-radius: 18px;
      padding: 20px 22px 18px;
      position: relative;
      animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    /* ── Search state (others) ── */
    .card-search {
      border: 1.5px solid rgba(245, 158, 11, 0.55);
      box-shadow: 0 12px 40px rgba(0,0,0,0.65),
                  0 0 0 1px rgba(245,158,11,0.15),
                  0 0 60px rgba(245,158,11,0.08);
    }

    /* ── Waiting state (caller) ── */
    .card-waiting {
      border: 1.5px solid rgba(56, 189, 248, 0.55);
      box-shadow: 0 12px 40px rgba(0,0,0,0.65),
                  0 0 0 1px rgba(56,189,248,0.15),
                  0 0 60px rgba(56,189,248,0.07);
    }

    /* ── Resolved state (caller only) ── */
    .card-resolved {
      border: 1.5px solid rgba(34, 197, 94, 0.6);
      box-shadow: 0 12px 40px rgba(0,0,0,0.65),
                  0 0 0 1px rgba(34,197,94,0.2),
                  0 0 60px rgba(34,197,94,0.1);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .badge-search { color: #f59e0b; }
    .badge-waiting { color: #38bdf8; }
    .badge-resolved { color: #22c55e; }

    .pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .pulse-amber { background: #f59e0b; }
    .pulse-blue { background: #38bdf8; }

    .model-name {
      font-size: 1.12rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .info-line {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 3px;
    }

    .caller-line {
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 14px;
    }

    /* ── Click-to-copy utility styles ── */
    .copyable {
      user-select: text !important;
      -webkit-user-select: text !important;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .copyable:hover {
      color: #38bdf8 !important;
      text-decoration: underline;
    }

    .copy-tooltip {
      position: absolute;
      top: 12px;
      right: 16px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      animation: copyToastFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes copyToastFade {
      0% { opacity: 0; transform: translateY(-6px) scale(0.95); }
      15% { opacity: 1; transform: translateY(0) scale(1); }
      80% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-6px) scale(0.95); }
    }

    /* ── Personnel List Scrollable Container ── */
    #w-personnel-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 170px;
      overflow-y: auto;
      padding-right: 3px;
    }

    #w-personnel-list::-webkit-scrollbar {
      width: 4px;
    }
    #w-personnel-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    #w-personnel-list::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.4);
      border-radius: 4px;
    }
    #w-personnel-list::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.7);
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-here {
      flex: 1;
      padding: 10px 0;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 12px rgba(22,163,74,0.3);
    }
    .btn-here:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(22,163,74,0.45); }
    .btn-here:active { transform: translateY(0); }
    .btn-here:disabled { opacity: 0.6; cursor: default; transform: none; }

    .btn-nothere {
      flex: 1;
      padding: 10px 0;
      background: rgba(255,255,255,0.07);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-nothere:hover { background: rgba(255,255,255,0.12); color: #cbd5e1; }

    .btn-cancel {
      width: 100%;
      padding: 10px 0;
      background: rgba(248,113,113,0.1);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 14px;
    }
    .btn-cancel:hover { background: rgba(248,113,113,0.18); border-color: rgba(248,113,113,0.5); }
    .btn-cancel:disabled { opacity: 0.5; cursor: default; }

    /* ── Resolved card ── */
    .resolved-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .check-icon { font-size: 2rem; line-height: 1; }
    .resolved-label {
      font-size: 0.7rem;
      color: #22c55e;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }
    .resolved-who {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 3px;
    }
    .resolved-device { font-size: 0.78rem; color: #94a3b8; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.72); }
    }
  </style>
</head>
<body>

<!-- ── STATE: Search (shown to OTHERS — not the caller) ── -->
<div class="card card-search" id="view-search" style="display:none;">
  <div class="badge badge-search">
    <span class="pulse pulse-amber"></span>
    Cihaz Aranıyor
  </div>
  <div class="model-name copyable" id="s-model" title="Kopyalamak için tıklayın">—</div>
  <div class="info-line">Seri: <strong id="s-serial" class="copyable" title="Kopyalamak için tıklayın">—</strong></div>
  <div class="info-line" id="s-customer-wrap" style="display:none;">Müşteri: <strong id="s-customer" class="copyable" title="Kopyalamak için tıklayın"></strong></div>
  <div class="caller-line">Çağrı yapan: <span id="s-caller">—</span></div>
  <div class="btn-row">
    <button class="btn-here" id="btn-here">📱 Cihaz Bende</button>
    <button class="btn-nothere" id="btn-nothere">Bende Değil</button>
  </div>
</div>

<!-- ── STATE: Waiting (shown ONLY to the caller — isMine) ── -->
<div class="card card-waiting" id="view-waiting" style="display:none;">
  <div class="badge badge-waiting">
    <span class="pulse pulse-blue"></span>
    Çağrı Gönderildi — Yanıt Bekleniyor
  </div>
  <div class="model-name copyable" id="w-model" title="Kopyalamak için tıklayın">—</div>
  <div class="info-line">Seri: <strong id="w-serial" class="copyable" title="Kopyalamak için tıklayın">—</strong></div>
  <div class="info-line" id="w-customer-wrap" style="display:none;">Müşteri: <strong id="w-customer" class="copyable" title="Kopyalamak için tıklayın"></strong></div>

  <!-- Live personnel status list -->
  <div id="w-personnel-wrap" style="display:none;margin-top:12px;">
    <div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:#475569;margin-bottom:7px;">Personel Durumu</div>
    <div id="w-personnel-list"></div>
  </div>

  <button class="btn-cancel" id="btn-cancel">✕ Çağrıyı İptal Et</button>
</div>

<!-- ── STATE: Resolved (shown ONLY to the caller when someone clicks Bende) ── -->
<div class="card card-resolved" id="view-resolved" style="display:none;">
  <div class="resolved-wrap">
    <div class="check-icon">✅</div>
    <div>
      <div class="resolved-label">Cihaz Bulundu!</div>
      <div class="resolved-who" id="r-who">—</div>
      <div class="resolved-device copyable" id="r-device" title="Kopyalamak için tıklayın">—</div>
    </div>
  </div>
</div>

<script>
  const api = window.electronAPI;
  let callId = null;

  function copyTextToClipboard(text, label) {
    if (!text || text === '—') return;
    const cleanText = text.trim();

    const doFeedback = () => {
      const existing = document.querySelector('.copy-tooltip');
      if (existing) existing.remove();
      const tooltip = document.createElement('div');
      tooltip.className = 'copy-tooltip';
      tooltip.textContent = `📋 ${label} kopyalandı!`;
      document.body.appendChild(tooltip);
      setTimeout(() => { if (tooltip.parentNode) tooltip.remove(); }, 1200);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cleanText).then(doFeedback).catch(() => fallbackCopy(cleanText, doFeedback));
    } else {
      fallbackCopy(cleanText, doFeedback);
    }
  }

  function fallbackCopy(text, callback) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      if (callback) callback();
    } catch (e) {}
    document.body.removeChild(textarea);
  }

  // Setup click listeners on all copyable elements
  document.addEventListener('click', (e) => {
    const target = e.target.closest('.copyable');
    if (!target) return;

    let label = 'Metin';
    if (target.id.includes('model')) label = 'Model';
    else if (target.id.includes('serial')) label = 'Seri No';
    else if (target.id.includes('customer')) label = 'Müşteri';
    else if (target.id.includes('device')) label = 'Cihaz Bilgisi';

    copyTextToClipboard(target.textContent, label);
  });

  function notifyWindowSize() {
    if (!callId || !api || !api.resizeDeviceCallToast) return;
    const activeCard = document.querySelector('.card:not([style*="display: none"])');
    if (activeCard) {
      const height = activeCard.offsetHeight + 8;
      api.resizeDeviceCallToast({ callId, height });
    }
  }

  // ── Web Audio Synth Chime Generator ──────────────────────────────
  function playChimeSound(type = 'call') {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();

      if (type === 'call') {
        // Soft, pleasant two-tone notification pop (E5 -> B5)
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'sine';

        osc1.frequency.setValueAtTime(659.25, now);
        osc2.frequency.setValueAtTime(987.77, now + 0.08);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc1.stop(now + 0.12);
        osc2.start(now + 0.08);
        osc2.stop(now + 0.4);
      } else if (type === 'resolve') {
        // Success chord (C5 -> E5 -> G5)
        const now = ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99];
        freqs.forEach((f, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + index * 0.07);

          gain.gain.setValueAtTime(0.15, now + index * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.07 + 0.28);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + index * 0.07);
          osc.stop(now + index * 0.07 + 0.28);
        });
      }
    } catch (e) {
      console.error('Chime audio error:', e);
    }
  }

  // Observe card size changes automatically
  const resizeObserver = new ResizeObserver(() => {
    notifyWindowSize();
  });
  document.querySelectorAll('.card').forEach(card => resizeObserver.observe(card));

  // ── Receive initial data from main process ──────────────────────────
  api.onDeviceCallToastData((data) => {
    callId = data.id;

    if (data.isMine) {
      // Caller: show waiting view
      document.getElementById('w-model').textContent = data.model_name || '—';
      document.getElementById('w-serial').textContent = data.serial || '—';
      if (data.customer_name) {
        document.getElementById('w-customer').textContent = data.customer_name;
        document.getElementById('w-customer-wrap').style.display = '';
      }
      show('view-waiting');
    } else {
      // Others: show search view & play soft chime
      document.getElementById('s-model').textContent = data.model_name || '—';
      document.getElementById('s-serial').textContent = data.serial || '—';
      document.getElementById('s-caller').textContent = data.created_by || '—';
      if (data.customer_name) {
        document.getElementById('s-customer').textContent = data.customer_name;
        document.getElementById('s-customer-wrap').style.display = '';
      }
      show('view-search');
      playChimeSound('call');
    }
  });

  // ── Resolution event: caller sees who found it ──────────────────────
  api.onDeviceCallToastResolve((data) => {
    document.getElementById('r-who').textContent =
      (data.resolved_by || '?') + ' cihazın kendisinde olduğunu belirtti.';
    document.getElementById('r-device').textContent =
      (data.model_name || '') + ' · ' + (data.serial || '');
    show('view-resolved');
    playChimeSound('resolve');
  });

  // ── Live personnel status update (caller only) ───────────────────────
  api.onDeviceCallStatusUpdate((statusData) => {
    updatePersonnelList(statusData.recipients || [], statusData.dismissed_by || []);
  });

  function updatePersonnelList(recipients, dismissedBy) {
    if (!recipients || recipients.length === 0) return;

    const wrap = document.getElementById('w-personnel-wrap');
    const list = document.getElementById('w-personnel-list');
    wrap.style.display = '';
    list.innerHTML = '';

    const dismissedSet = new Set(dismissedBy || []);

    recipients.forEach(name => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,0.04);';

      const isDismissed = dismissedSet.has(name);

      const icon = document.createElement('span');
      icon.style.cssText = 'font-size:0.85rem;line-height:1;flex-shrink:0;';
      icon.textContent = isDismissed ? '❌' : '⏳';

      const nameEl = document.createElement('span');
      nameEl.style.cssText = `font-size:0.82rem;font-weight:600;color:${isDismissed ? '#64748b' : '#cbd5e1'};${isDismissed ? 'text-decoration:line-through;' : ''}`;
      nameEl.textContent = name;

      const statusEl = document.createElement('span');
      statusEl.style.cssText = `font-size:0.72rem;margin-left:auto;font-weight:500;color:${isDismissed ? '#f87171' : '#94a3b8'};`;
      statusEl.textContent = isDismissed ? 'Bende Değil' : 'Yanıt Bekleniyor';

      row.appendChild(icon);
      row.appendChild(nameEl);
      row.appendChild(statusEl);
      list.appendChild(row);
    });

    notifyWindowSize();
  }

  // ── Buttons ──────────────────────────────────────────────────────────
  document.getElementById('btn-here').onclick = () => {
    const btn = document.getElementById('btn-here');
    btn.textContent = 'Gönderiliyor...';
    btn.disabled = true;
    document.getElementById('btn-nothere').disabled = true;
    api.deviceCallAction({ action: 'here', callId });
  };

  document.getElementById('btn-nothere').onclick = () => {
    api.deviceCallAction({ action: 'nothere', callId });
  };

  document.getElementById('btn-cancel').onclick = () => {
    const btn = document.getElementById('btn-cancel');
    btn.textContent = 'İptal ediliyor...';
    btn.disabled = true;
    api.deviceCallAction({ action: 'cancel', callId });
  };

  // ── Helper ───────────────────────────────────────────────────────────
  function show(id) {
    ['view-search', 'view-waiting', 'view-resolved'].forEach(v => {
      document.getElementById(v).style.display = v === id ? '' : 'none';
    });
    notifyWindowSize();
  }
</script>

</body>
</html>
