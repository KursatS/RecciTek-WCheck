<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecciTek - Admin Paneli</title>
    <link rel="stylesheet" href="./input.css">
    <link rel="stylesheet" href="./theme.css">
    <style>
        body {
            padding: 24px;
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #38bdf8;
        }

        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background: #0ea5e9;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .user-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            position: relative;
        }

        .user-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: #f8fafc;
        }

        .user-card p {
            margin: 4px 0;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .badge-admin {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-mh {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-kargo {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.8rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .btn-edit {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 400px;
            max-width: 90vw;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-content h2 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>👨‍💼 Kullanıcı Yönetimi</h1>
        <button class="btn-primary" id="btn-add-user">Yeni Kullanıcı Ekle</button>
    </div>

    <div class="users-grid" id="users-grid">
        <!-- Kullanıcılar buraya yüklenecek -->
        <div style="color: #64748b;">Yükleniyor...</div>
    </div>

    <!-- User Modal -->
    <div class="modal-overlay" id="user-modal">
        <div class="modal-content">
            <h2 id="modal-title">Yeni Kullanıcı</h2>
            <input type="hidden" id="user-id">

            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="user-username" placeholder="Sisteme giriş adı...">
            </div>

            <div class="form-group">
                <label>Şifre</label>
                <input type="text" id="user-password" placeholder="Giriş şifresi...">
            </div>

            <div class="form-group">
                <label>Ad Soyad</label>
                <input type="text" id="user-fullname" placeholder="Personel ad soyad...">
            </div>

            <div class="form-group">
                <label>Rol (Görev)</label>
                <select id="user-role">
                    <option value="kargo_kabul">Kargo Kabul (Hasar Onarım Listesi Ekler)</option>
                    <option value="mh">Müşteri Hizmetleri (Bilet Cevaplar)</option>
                    <option value="admin">Yönetici (Admin)</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" id="btn-cancel-modal">İptal</button>
                <button class="btn-primary" id="btn-save-user">Kaydet</button>
            </div>
        </div>
    </div>

    <script src="./admin-renderer.ts" type="module"></script>
</body>

</html>
